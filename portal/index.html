<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Client Login | NewLife Marketing Portal</title>
<link rel="canonical" href="https://newlifemarketing.ca/portal/">
<meta name="description" content="Client login for the NewLife Marketing portal. Sign in to access your dashboards, campaign reports, leads and CRM in one secure NewLife Marketing client portal.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,700;1,700;1,800;1,900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/portal/portal.css">
<!-- BEGIN SITE HEAD ICONS — managed by scripts/sync-chrome.mjs; edit partials/head-icons.html, not here --><link rel="icon" type="image/png" href="/assets/brand/favicon.png"><link rel="apple-touch-icon" href="/assets/brand/favicon.png"><!-- END SITE HEAD ICONS --></head>
<body>
<a class="pl-back" href="/">← Back to newlifemarketing.ca</a>
<main class="pl-login">
  <form class="pl-login-card" id="pl-login-form" novalidate>
    <a class="pl-logo" href="/">NewLife <span class="blue">Marketing</span></a>
    <p class="pl-sub">Client Portal</p>

    <div class="pl-field">
      <label for="pl-email">Email</label>
      <input id="pl-email" name="email" type="email" autocomplete="email" placeholder="you@yourbusiness.ca" required>
    </div>
    <div class="pl-field">
      <label for="pl-password">Password</label>
      <input id="pl-password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
    </div>
    <div class="pl-row-between">
      <label><input type="checkbox" name="remember"> Keep me signed in</label>
      <a href="#" id="pl-forgot">Forgot password?</a>
    </div>

    <div id="pl-login-error" role="alert" style="display:none;font-size:0.82rem;color:#ff8080;background:rgba(255,107,107,0.1);border:1px solid rgba(255,107,107,0.4);border-radius:8px;padding:0.6rem 0.8rem;margin-bottom:1rem"></div>

    <button class="pl-btn full" type="submit">Sign In</button>

    <p class="pl-note">Client access only. Trouble signing in? Email
      <a href="mailto:contact@newlifemarketing.ca">contact@newlifemarketing.ca</a>.</p>
  </form>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/portal/config.js"></script>
<script src="/portal/auth.js"></script>
</body>
</html>
