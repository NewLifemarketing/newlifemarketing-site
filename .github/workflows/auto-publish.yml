name: Auto-publish blog PR

# Validates a blog/{slug} PR against the pipeline's hard safety limits, then
# squash-merges it automatically if (and only if) every check passes. This
# is where merging actually happens — the pipeline's site-publisher agent
# only ever opens the PR and must never merge it itself; do not weaken that
# rule in the agent instead of here.
#
# Triggers:
#   - automatically when a PR from a branch named blog/* is opened/updated
#     against main
#   - manually via workflow_dispatch, passing the PR number, for testing
#     against an existing PR

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to validate and (if it passes) merge"
        required: true
        type: number
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  # The pipeline pushes the branch from the SYSTEM repo, then calls `gh pr
  # create` there -- and that failed silently from 2026-09-28: "Resource not
  # accessible by integration (createPullRequest)". The push worked because the
  # remote URL carried a token; gh never got that credential, so it fell back to
  # the app token, which can write to this repo but cannot open a PR in it.
  # SITE_REPO_TOKEN, the secret the pipeline asks for first, has never existed --
  # it silently degrades to `|| NEWLIFE_CLOUD_BLOG_PIPELINE`, so two days of
  # posts became branches with no PR and the workflow still reported success.
  #
  # Opening the PR from HERE needs no new credential: this workflow already runs
  # in this repo with pull-requests: write on its own GITHUB_TOKEN.
  push:
    branches:
      - 'blog/**'
      - 'articles/**'
      - 'landing/**'          # landing-pages system: validated, auto-merged
      - 'landing-review/**'   # landing-pages system: validated, NEVER auto-merged (owner merges)

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write        # open-pr dispatches this workflow back at itself

concurrency:
  group: auto-publish-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: true

jobs:
  # Runs ONLY on a branch push. Opens the PR the pipeline could not, then hands
  # the number to the validate job below.
  #
  # Why the dispatch instead of letting `pull_request` fire: GitHub deliberately
  # does not raise workflow events for things done with GITHUB_TOKEN, so a PR
  # opened here would never trigger the `pull_request` run that validates it.
  # workflow_dispatch is exempt, and this file already accepts a pr_number that
  # way, so it is the existing supported path, not a new one.
  open-pr:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Open a PR for this branch if one is not already open
        id: open
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_REF#refs/heads/}"
          echo "branch: $BRANCH"

          # Idempotent: every later push to the same branch re-runs this job, and
          # a second PR for one post would be worse than none.
          EXISTING=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" \
                       --state open --json number -q '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING already open for $BRANCH — nothing to do."
            echo "number=$EXISTING" >> "$GITHUB_OUTPUT"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Title from the post's own <title>, minus the site suffix. Falls back
          # to the slug so a malformed post still gets a reviewable PR rather
          # than being silently dropped.
          #
          # This deliberately does NOT diff against main. The smoke test on
          # 2026-09-30 did, and every title came out as the bare slug, because
          # actions/checkout makes a shallow single-branch clone and origin/main
          # simply is not there: "fatal: ambiguous argument 'origin/main...HEAD'".
          # The branch name already encodes the path -- blog/<slug> holds
          # blog/<slug>/index.html -- so deriving it is both exact and free, and
          # needs no extra fetch.
          # landing/<slug> and landing-review/<slug> hold a ROOT-level page,
          # <slug>/index.html, not <branch>/index.html like blog/ and articles/.
          case "$BRANCH" in
            landing/*|landing-review/*) FILE="${BRANCH#*/}/index.html" ;;
            *)                          FILE="$BRANCH/index.html" ;;
          esac
          TITLE=""
          if [ -n "$FILE" ] && [ -f "$FILE" ]; then
            # Strip the trailing brand segment, whatever it is. Hardcoding
            # "| NewLife Marketing" looked right and matched nothing -- the real
            # titles end "| NewLife" -- and this file gets copied to the other
            # three site repos, each with its own brand. Dropping the last
            # pipe-delimited segment is brand-agnostic and leaves a title that
            # has no pipe completely alone.
            TITLE=$(sed -n 's:.*<title>\(.*\)</title>.*:\1:p' "$FILE" | head -1 | sed 's/ *| *[^|]*$//')
          fi
          [ -n "$TITLE" ] || TITLE="${BRANCH#*/}"
          case "$BRANCH" in
            articles/*) PREFIX="Article" ;;
            landing-review/*) PREFIX="Landing page (review)" ;;
            landing/*) PREFIX="Landing page" ;;
            *)          PREFIX="Blog" ;;
          esac

          NUM=$(gh pr create --repo "$GITHUB_REPOSITORY" \
                  --base main --head "$BRANCH" \
                  --title "$PREFIX: $TITLE" \
                  --body "Opened automatically by auto-publish.yml on branch push. The content pipeline pushes the branch from the system repo but cannot open a PR here, so this repo opens its own. Validation runs next via workflow_dispatch." \
                | grep -oE '[0-9]+$' | tail -1)

          echo "opened PR #$NUM"
          echo "number=$NUM" >> "$GITHUB_OUTPUT"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Hand the PR to validation
        if: steps.open.outputs.created == 'true'
        run: |
          set -euo pipefail
          gh workflow run auto-publish.yml --repo "$GITHUB_REPOSITORY" \
            -f pr_number="${{ steps.open.outputs.number }}"
          echo "dispatched validation for PR #${{ steps.open.outputs.number }}"

  validate-and-merge:
    if: >
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.pull_request.head.ref, 'blog/')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Resolve PR number
        id: pr
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "number=${{ github.event.inputs.pr_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Look up PR metadata
        id: meta
        run: |
          gh pr view ${{ steps.pr.outputs.number }} --repo ${{ github.repository }} \
            --json headRefName,baseRefName,title,url,state \
            > pr_meta.json
          echo "head_ref=$(jq -r .headRefName pr_meta.json)" >> "$GITHUB_OUTPUT"
          echo "pr_title=$(jq -r .title pr_meta.json)" >> "$GITHUB_OUTPUT"
          echo "pr_url=$(jq -r .url pr_meta.json)" >> "$GITHUB_OUTPUT"
          echo "pr_state=$(jq -r .state pr_meta.json)" >> "$GITHUB_OUTPUT"

      - name: Guard — only ever act on blog/* branches, only while open
        run: |
          if [[ "${{ steps.meta.outputs.head_ref }}" != blog/* ]]; then
            echo "PR #${{ steps.pr.outputs.number }} head branch '${{ steps.meta.outputs.head_ref }}' does not start with blog/ — refusing to touch it."
            exit 1
          fi
          if [ "${{ steps.meta.outputs.pr_state }}" != "OPEN" ]; then
            echo "PR #${{ steps.pr.outputs.number }} is not open (state: ${{ steps.meta.outputs.pr_state }}) — nothing to do."
            exit 1
          fi

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ steps.pr.outputs.number }}/head
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run validation gate
        id: validate
        run: |
          set +e
          node .github/scripts/validate-blog-pr.mjs
          v=$?
          # Chrome gate: the new post must carry the header/footer markers and match
          # the canonical partials, so it is born in sync and stays syncable.
          chrome=$(node scripts/sync-chrome.mjs --check --only "blog/**/index.html" --require-participation 2>&1)
          c=$?
          echo "$chrome"
          set -e
          if [ "$c" -ne 0 ]; then
            [ -f validation-result.json ] || echo '{"failures":[]}' > validation-result.json
            msg='Site chrome check failed — the new post is missing the header/footer markers or is out of date with partials/. Regenerate from the current template, or run `node scripts/sync-chrome.mjs --write`. See partials/README.md.'
            tmp=$(mktemp); jq --arg m "$msg" '.failures += [$m] | .pass=false' validation-result.json > "$tmp" && mv "$tmp" validation-result.json
          fi
          if [ "$v" -ne 0 ] || [ "$c" -ne 0 ]; then echo "exit_code=1" >> "$GITHUB_OUTPUT"; else echo "exit_code=0" >> "$GITHUB_OUTPUT"; fi

      - name: Read validation result
        id: result
        if: always()
        run: |
          if [ ! -f validation-result.json ]; then
            echo '{"failures":["validate-blog-pr.mjs crashed before producing a result — check the workflow run logs for the actual error."]}' > validation-result.json
          fi
          echo "post_title=$(jq -r '.title // empty' validation-result.json)" >> "$GITHUB_OUTPUT"
          echo "post_url=$(jq -r '.url // empty' validation-result.json)" >> "$GITHUB_OUTPUT"
          # Build a plain bullet list of failures for the PR comment/email
          jq -r '.failures[]? | "- " + .' validation-result.json > failures.txt || true

      # ---------------------------------------------------------------
      # PASS path
      # ---------------------------------------------------------------
      - name: Squash-merge the PR
        if: steps.validate.outputs.exit_code == '0'
        run: |
          gh pr merge ${{ steps.pr.outputs.number }} --repo ${{ github.repository }} \
            --squash --delete-branch \
            --subject "Add blog post: ${{ steps.result.outputs.post_title || steps.meta.outputs.pr_title }}"

      - name: Send "published" email
        if: steps.validate.outputs.exit_code == '0'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          POST_TITLE: ${{ steps.result.outputs.post_title || steps.meta.outputs.pr_title }}
          POST_URL: ${{ steps.result.outputs.post_url }}
        run: |
          # Non-fatal by design: the post is already merged by this point in
          # the job, so a notification email failing (bad key, rate limit,
          # unverified recipient, network blip — anything) must never fail
          # this step or the job. Log a warning and move on, always exit 0.
          set +e
          BODY_TEXT=$(printf '%s just went live.\n\n%s' "$POST_TITLE" "$POST_URL")
          PAYLOAD=$(jq -n \
            --arg from "onboarding@resend.dev" \
            --arg to "contact@newlifemarketing.ca" \
            --arg subject "New blog post published: $POST_TITLE" \
            --arg text "$BODY_TEXT" \
            '{from: $from, to: [$to], subject: $subject, text: $text}')
          HTTP_STATUS=$(curl -sS -o response.txt -w '%{http_code}' https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          if [ "$HTTP_STATUS" -ge 200 ] 2>/dev/null && [ "$HTTP_STATUS" -lt 300 ] 2>/dev/null; then
            echo "Notification email sent (HTTP $HTTP_STATUS)."
          else
            echo "::warning::'Published' notification email failed (HTTP ${HTTP_STATUS:-unknown}) — continuing, this does not affect the merge. Response: $(cat response.txt 2>/dev/null)"
          fi
          exit 0

      # ---------------------------------------------------------------
      # FAIL path
      # ---------------------------------------------------------------
      - name: Ensure the validation-failed label exists
        if: steps.validate.outputs.exit_code != '0'
        run: |
          gh label create "validation-failed" --repo ${{ github.repository }} \
            --color "d73a4a" --description "Auto-publish validation gate failed" || true

      - name: Comment failures and label the PR
        if: steps.validate.outputs.exit_code != '0'
        run: |
          {
            echo "**Auto-publish validation failed — not merged.**"
            echo
            echo "The following checks failed:"
            echo
            cat failures.txt
          } > comment_body.txt
          gh pr comment ${{ steps.pr.outputs.number }} --repo ${{ github.repository }} --body-file comment_body.txt
          gh pr edit ${{ steps.pr.outputs.number }} --repo ${{ github.repository }} --add-label "validation-failed"

      - name: Send "needs review" email
        if: steps.validate.outputs.exit_code != '0'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          POST_TITLE: ${{ steps.result.outputs.post_title || steps.meta.outputs.pr_title }}
          PR_URL: ${{ steps.meta.outputs.pr_url }}
        run: |
          # Non-fatal by design (see the "published" email step above for
          # why): a notification failure must never stop the "Fail the job
          # if validation failed" step from running afterward, and must
          # never be the reason this job reports failure — the validation
          # failure itself is already the correct reason.
          set +e
          FAILURES=$(cat failures.txt)
          BODY_TEXT=$(printf 'Auto-publish validation failed for: %s\n\nFailed checks:\n%s\n\nPR: %s' "$POST_TITLE" "$FAILURES" "$PR_URL")
          PAYLOAD=$(jq -n \
            --arg from "onboarding@resend.dev" \
            --arg to "contact@newlifemarketing.ca" \
            --arg subject "Blog post needs review: $POST_TITLE" \
            --arg text "$BODY_TEXT" \
            '{from: $from, to: [$to], subject: $subject, text: $text}')
          HTTP_STATUS=$(curl -sS -o response.txt -w '%{http_code}' https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          if [ "$HTTP_STATUS" -ge 200 ] 2>/dev/null && [ "$HTTP_STATUS" -lt 300 ] 2>/dev/null; then
            echo "Notification email sent (HTTP $HTTP_STATUS)."
          else
            echo "::warning::'Needs review' notification email failed (HTTP ${HTTP_STATUS:-unknown}) — continuing. Response: $(cat response.txt 2>/dev/null)"
          fi
          exit 0

      - name: Fail the job if validation failed
        if: steps.validate.outputs.exit_code != '0'
        run: exit 1

  validate-and-merge-article:
    if: >
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.pull_request.head.ref, 'articles/')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    concurrency:
      group: auto-publish-article-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
      cancel-in-progress: true
    steps:
      - name: Resolve PR number
        id: pr
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "number=${{ github.event.inputs.pr_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Look up PR metadata
        id: meta
        run: |
          gh pr view ${{ steps.pr.outputs.number }} --repo ${{ github.repository }} \
            --json headRefName,baseRefName,title,url,state \
            > pr_meta.json
          echo "head_ref=$(jq -r .headRefName pr_meta.json)" >> "$GITHUB_OUTPUT"
          echo "pr_title=$(jq -r .title pr_meta.json)" >> "$GITHUB_OUTPUT"
          echo "pr_url=$(jq -r .url pr_meta.json)" >> "$GITHUB_OUTPUT"
          echo "pr_state=$(jq -r .state pr_meta.json)" >> "$GITHUB_OUTPUT"

      - name: Guard — only ever act on articles/* branches, only while open
        run: |
          if [[ "${{ steps.meta.outputs.head_ref }}" != articles/* ]]; then
            echo "PR #${{ steps.pr.outputs.number }} head branch '${{ steps.meta.outputs.head_ref }}' does not start with articles/ — refusing to touch it."
            exit 1
          fi
          if [ "${{ steps.meta.outputs.pr_state }}" != "OPEN" ]; then
            echo "PR #${{ steps.pr.outputs.number }} is not open (state: ${{ steps.meta.outputs.pr_state }}) — nothing to do."
            exit 1
          fi

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ steps.pr.outputs.number }}/head
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run validation gate
        id: validate
        run: |
          set +e
          node .github/scripts/validate-article-pr.mjs
          v=$?
          # Chrome gate: the new article must carry the header/footer markers and match
          # the canonical partials, so it is born in sync and stays syncable.
          chrome=$(node scripts/sync-chrome.mjs --check --only "articles/**/index.html" --require-participation 2>&1)
          c=$?
          echo "$chrome"
          set -e
          if [ "$c" -ne 0 ]; then
            [ -f validation-result.json ] || echo '{"failures":[]}' > validation-result.json
            msg='Site chrome check failed — the new article is missing the header/footer markers or is out of date with partials/. Regenerate from the current template, or run `node scripts/sync-chrome.mjs --write`. See partials/README.md.'
            tmp=$(mktemp); jq --arg m "$msg" '.failures += [$m] | .pass=false' validation-result.json > "$tmp" && mv "$tmp" validation-result.json
          fi
          if [ "$v" -ne 0 ] || [ "$c" -ne 0 ]; then echo "exit_code=1" >> "$GITHUB_OUTPUT"; else echo "exit_code=0" >> "$GITHUB_OUTPUT"; fi

      - name: Read validation result
        id: result
        if: always()
        run: |
          if [ ! -f validation-result.json ]; then
            echo '{"failures":["validate-article-pr.mjs crashed before producing a result — check the workflow run logs for the actual error."]}' > validation-result.json
          fi
          echo "post_title=$(jq -r '.title // empty' validation-result.json)" >> "$GITHUB_OUTPUT"
          echo "post_url=$(jq -r '.url // empty' validation-result.json)" >> "$GITHUB_OUTPUT"
          # Build a plain bullet list of failures for the PR comment/email
          jq -r '.failures[]? | "- " + .' validation-result.json > failures.txt || true

      # ---------------------------------------------------------------
      # PASS path
      # ---------------------------------------------------------------
      - name: Squash-merge the PR
        if: steps.validate.outputs.exit_code == '0'
        run: |
          gh pr merge ${{ steps.pr.outputs.number }} --repo ${{ github.repository }} \
            --squash --delete-branch \
            --subject "Add article: ${{ steps.result.outputs.post_title || steps.meta.outputs.pr_title }}"

      - name: Send "published" email
        if: steps.validate.outputs.exit_code == '0'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          POST_TITLE: ${{ steps.result.outputs.post_title || steps.meta.outputs.pr_title }}
          POST_URL: ${{ steps.result.outputs.post_url }}
        run: |
          # Non-fatal by design: the post is already merged by this point in
          # the job, so a notification email failing (bad key, rate limit,
          # unverified recipient, network blip — anything) must never fail
          # this step or the job. Log a warning and move on, always exit 0.
          set +e
          BODY_TEXT=$(printf '%s just went live.\n\n%s' "$POST_TITLE" "$POST_URL")
          PAYLOAD=$(jq -n \
            --arg from "onboarding@resend.dev" \
            --arg to "contact@newlifemarketing.ca" \
            --arg subject "New article published: $POST_TITLE" \
            --arg text "$BODY_TEXT" \
            '{from: $from, to: [$to], subject: $subject, text: $text}')
          HTTP_STATUS=$(curl -sS -o response.txt -w '%{http_code}' https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          if [ "$HTTP_STATUS" -ge 200 ] 2>/dev/null && [ "$HTTP_STATUS" -lt 300 ] 2>/dev/null; then
            echo "Notification email sent (HTTP $HTTP_STATUS)."
          else
            echo "::warning::'Published' notification email failed (HTTP ${HTTP_STATUS:-unknown}) — continuing, this does not affect the merge. Response: $(cat response.txt 2>/dev/null)"
          fi
          exit 0

      # ---------------------------------------------------------------
      # FAIL path
      # ---------------------------------------------------------------
      - name: Ensure the validation-failed label exists
        if: steps.validate.outputs.exit_code != '0'
        run: |
          gh label create "validation-failed" --repo ${{ github.repository }} \
            --color "d73a4a" --description "Auto-publish validation gate failed" || true

      - name: Comment failures and label the PR
        if: steps.validate.outputs.exit_code != '0'
        run: |
          {
            echo "**Auto-publish validation failed — not merged.**"
            echo
            echo "The following checks failed:"
            echo
            cat failures.txt
          } > comment_body.txt
          gh pr comment ${{ steps.pr.outputs.number }} --repo ${{ github.repository }} --body-file comment_body.txt
          gh pr edit ${{ steps.pr.outputs.number }} --repo ${{ github.repository }} --add-label "validation-failed"

      - name: Send "needs review" email
        if: steps.validate.outputs.exit_code != '0'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          POST_TITLE: ${{ steps.result.outputs.post_title || steps.meta.outputs.pr_title }}
          PR_URL: ${{ steps.meta.outputs.pr_url }}
        run: |
          # Non-fatal by design (see the "published" email step above for
          # why): a notification failure must never stop the "Fail the job
          # if validation failed" step from running afterward, and must
          # never be the reason this job reports failure — the validation
          # failure itself is already the correct reason.
          set +e
          FAILURES=$(cat failures.txt)
          BODY_TEXT=$(printf 'Auto-publish validation failed for: %s\n\nFailed checks:\n%s\n\nPR: %s' "$POST_TITLE" "$FAILURES" "$PR_URL")
          PAYLOAD=$(jq -n \
            --arg from "onboarding@resend.dev" \
            --arg to "contact@newlifemarketing.ca" \
            --arg subject "Article needs review: $POST_TITLE" \
            --arg text "$BODY_TEXT" \
            '{from: $from, to: [$to], subject: $subject, text: $text}')
          HTTP_STATUS=$(curl -sS -o response.txt -w '%{http_code}' https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          if [ "$HTTP_STATUS" -ge 200 ] 2>/dev/null && [ "$HTTP_STATUS" -lt 300 ] 2>/dev/null; then
            echo "Notification email sent (HTTP $HTTP_STATUS)."
          else
            echo "::warning::'Needs review' notification email failed (HTTP ${HTTP_STATUS:-unknown}) — continuing. Response: $(cat response.txt 2>/dev/null)"
          fi
          exit 0

      - name: Fail the job if validation failed
        if: steps.validate.outputs.exit_code != '0'
        run: exit 1

  validate-and-merge-landing:
    if: >
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.pull_request.head.ref, 'landing/') ||
      startsWith(github.event.pull_request.head.ref, 'landing-review/')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    concurrency:
      group: auto-publish-landing-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
      cancel-in-progress: true
    steps:
      - name: Resolve PR number
        id: pr
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "number=${{ github.event.inputs.pr_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Look up PR metadata
        id: meta
        run: |
          gh pr view ${{ steps.pr.outputs.number }} --repo ${{ github.repository }} \
            --json headRefName,baseRefName,title,url,state \
            > pr_meta.json
          echo "head_ref=$(jq -r .headRefName pr_meta.json)" >> "$GITHUB_OUTPUT"
          echo "pr_title=$(jq -r .title pr_meta.json)" >> "$GITHUB_OUTPUT"
          echo "pr_url=$(jq -r .url pr_meta.json)" >> "$GITHUB_OUTPUT"
          echo "pr_state=$(jq -r .state pr_meta.json)" >> "$GITHUB_OUTPUT"

      - name: Guard — only ever act on landing/* or landing-review/* branches, only while open
        run: |
          if [[ "${{ steps.meta.outputs.head_ref }}" != landing/* && "${{ steps.meta.outputs.head_ref }}" != landing-review/* ]]; then
            echo "PR #${{ steps.pr.outputs.number }} head branch '${{ steps.meta.outputs.head_ref }}' is not landing/* or landing-review/* — refusing to touch it."
            exit 1
          fi
          if [ "${{ steps.meta.outputs.pr_state }}" != "OPEN" ]; then
            echo "PR #${{ steps.pr.outputs.number }} is not open (state: ${{ steps.meta.outputs.pr_state }}) — nothing to do."
            exit 1
          fi

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ steps.pr.outputs.number }}/head
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run validation gate
        id: validate
        run: |
          set +e
          HEAD_REF="${{ steps.meta.outputs.head_ref }}" node .github/scripts/validate-landing-pr.mjs
          v=$?
          # Chrome gate: the new landing page must carry the header/footer markers and match
          # the canonical partials, so it is born in sync and stays syncable.
          SLUG="${{ steps.meta.outputs.head_ref }}"; SLUG="${SLUG#*/}"
          chrome=$(node scripts/sync-chrome.mjs --check --only "$SLUG/index.html" --require-participation 2>&1)
          c=$?
          echo "$chrome"
          set -e
          if [ "$c" -ne 0 ]; then
            [ -f validation-result.json ] || echo '{"failures":[]}' > validation-result.json
            msg='Site chrome check failed — the new landing page is missing the header/footer markers or is out of date with partials/. Regenerate from the current template, or run `node scripts/sync-chrome.mjs --write`. See partials/README.md.'
            tmp=$(mktemp); jq --arg m "$msg" '.failures += [$m] | .pass=false' validation-result.json > "$tmp" && mv "$tmp" validation-result.json
          fi
          if [ "$v" -ne 0 ] || [ "$c" -ne 0 ]; then echo "exit_code=1" >> "$GITHUB_OUTPUT"; else echo "exit_code=0" >> "$GITHUB_OUTPUT"; fi

      - name: Read validation result
        id: result
        if: always()
        run: |
          if [ ! -f validation-result.json ]; then
            echo '{"failures":["validate-landing-pr.mjs crashed before producing a result — check the workflow run logs for the actual error."]}' > validation-result.json
          fi
          echo "post_title=$(jq -r '.title // empty' validation-result.json)" >> "$GITHUB_OUTPUT"
          echo "post_url=$(jq -r '.url // empty' validation-result.json)" >> "$GITHUB_OUTPUT"
          # Build a plain bullet list of failures for the PR comment/email
          jq -r '.failures[]? | "- " + .' validation-result.json > failures.txt || true

      # ---------------------------------------------------------------
      # PASS path
      # ---------------------------------------------------------------
      # landing-review/* = the owner's first test pages. Validate, report, and
      # STOP: the owner merges these by hand (decision 2026-09-30). Only
      # landing/* is ever merged here.
      - name: Review branch — report the pass, do not merge
        if: steps.validate.outputs.exit_code == '0' && startsWith(steps.meta.outputs.head_ref, 'landing-review/')
        run: |
          gh pr comment ${{ steps.pr.outputs.number }} --repo ${{ github.repository }} \
            --body "**Validation passed.** This is a landing-review branch, so it is not merged automatically. Review the page and merge it yourself. Once 3 landing pages are live the system switches to landing/ branches, which merge here on a pass."

      - name: Squash-merge the PR
        if: steps.validate.outputs.exit_code == '0' && startsWith(steps.meta.outputs.head_ref, 'landing/')
        run: |
          gh pr merge ${{ steps.pr.outputs.number }} --repo ${{ github.repository }} \
            --squash --delete-branch \
            --subject "Add landing page: ${{ steps.result.outputs.post_title || steps.meta.outputs.pr_title }}"

      - name: Send "published" email
        if: steps.validate.outputs.exit_code == '0' && startsWith(steps.meta.outputs.head_ref, 'landing/')
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          POST_TITLE: ${{ steps.result.outputs.post_title || steps.meta.outputs.pr_title }}
          POST_URL: ${{ steps.result.outputs.post_url }}
        run: |
          # Non-fatal by design: the post is already merged by this point in
          # the job, so a notification email failing (bad key, rate limit,
          # unverified recipient, network blip — anything) must never fail
          # this step or the job. Log a warning and move on, always exit 0.
          set +e
          BODY_TEXT=$(printf '%s just went live.\n\n%s' "$POST_TITLE" "$POST_URL")
          PAYLOAD=$(jq -n \
            --arg from "onboarding@resend.dev" \
            --arg to "contact@newlifemarketing.ca" \
            --arg subject "New landing page published: $POST_TITLE" \
            --arg text "$BODY_TEXT" \
            '{from: $from, to: [$to], subject: $subject, text: $text}')
          HTTP_STATUS=$(curl -sS -o response.txt -w '%{http_code}' https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          if [ "$HTTP_STATUS" -ge 200 ] 2>/dev/null && [ "$HTTP_STATUS" -lt 300 ] 2>/dev/null; then
            echo "Notification email sent (HTTP $HTTP_STATUS)."
          else
            echo "::warning::'Published' notification email failed (HTTP ${HTTP_STATUS:-unknown}) — continuing, this does not affect the merge. Response: $(cat response.txt 2>/dev/null)"
          fi
          exit 0

      # ---------------------------------------------------------------
      # FAIL path
      # ---------------------------------------------------------------
      - name: Ensure the validation-failed label exists
        if: steps.validate.outputs.exit_code != '0'
        run: |
          gh label create "validation-failed" --repo ${{ github.repository }} \
            --color "d73a4a" --description "Auto-publish validation gate failed" || true

      - name: Comment failures and label the PR
        if: steps.validate.outputs.exit_code != '0'
        run: |
          {
            echo "**Auto-publish validation failed — not merged.**"
            echo
            echo "The following checks failed:"
            echo
            cat failures.txt
          } > comment_body.txt
          gh pr comment ${{ steps.pr.outputs.number }} --repo ${{ github.repository }} --body-file comment_body.txt
          gh pr edit ${{ steps.pr.outputs.number }} --repo ${{ github.repository }} --add-label "validation-failed"

      - name: Send "needs review" email
        if: steps.validate.outputs.exit_code != '0'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          POST_TITLE: ${{ steps.result.outputs.post_title || steps.meta.outputs.pr_title }}
          PR_URL: ${{ steps.meta.outputs.pr_url }}
        run: |
          # Non-fatal by design (see the "published" email step above for
          # why): a notification failure must never stop the "Fail the job
          # if validation failed" step from running afterward, and must
          # never be the reason this job reports failure — the validation
          # failure itself is already the correct reason.
          set +e
          FAILURES=$(cat failures.txt)
          BODY_TEXT=$(printf 'Auto-publish validation failed for: %s\n\nFailed checks:\n%s\n\nPR: %s' "$POST_TITLE" "$FAILURES" "$PR_URL")
          PAYLOAD=$(jq -n \
            --arg from "onboarding@resend.dev" \
            --arg to "contact@newlifemarketing.ca" \
            --arg subject "Landing page needs review: $POST_TITLE" \
            --arg text "$BODY_TEXT" \
            '{from: $from, to: [$to], subject: $subject, text: $text}')
          HTTP_STATUS=$(curl -sS -o response.txt -w '%{http_code}' https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          if [ "$HTTP_STATUS" -ge 200 ] 2>/dev/null && [ "$HTTP_STATUS" -lt 300 ] 2>/dev/null; then
            echo "Notification email sent (HTTP $HTTP_STATUS)."
          else
            echo "::warning::'Needs review' notification email failed (HTTP ${HTTP_STATUS:-unknown}) — continuing. Response: $(cat response.txt 2>/dev/null)"
          fi
          exit 0

      - name: Fail the job if validation failed
        if: steps.validate.outputs.exit_code != '0'
        run: exit 1
